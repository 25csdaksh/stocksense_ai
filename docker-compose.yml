version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: marketmind_timescaledb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketmind_db}
      POSTGRES_USER: ${POSTGRES_USER:-marketmind_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketmind_secret}
    ports:
      - "5432:5432"
    volumes:
      - timescale_storage:/var/lib/postgresql/data
      - ./docker/timescale_init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketmind_admin -d marketmind_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketmind_net

  redis:
    image: redis:7-alpine
    container_name: marketmind_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_storage:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketmind_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: marketmind_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketmind_net

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: marketmind_backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-marketmind_admin}:${POSTGRES_PASSWORD:-marketmind_secret}@timescaledb:5432/${POSTGRES_DB:-marketmind_db}
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - marketmind_net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: marketmind_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/market-feed
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - marketmind_net

volumes:
  timescale_storage:
  redis_storage:
  qdrant_storage:

networks:
  marketmind_net:
    driver: bridge
